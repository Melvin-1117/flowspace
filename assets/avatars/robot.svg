<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="roboBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#001A3D"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B8CAE"/>
      <stop offset="100%" stop-color="#2D4A6B"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00B4FF"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#roboBg)" stroke="#1A2640" stroke-width="2"/>

  <!-- Neck -->
  <rect x="44" y="66" width="12" height="12" rx="3" fill="#1A2640" stroke="#2D4A6B" stroke-width="1.5"/>
  <line x1="47" y1="72" x2="53" y2="72" stroke="#6B8CAE" stroke-width="1.5"/>

  <!-- Shoulders -->
  <path d="M 30 78 C 30 78, 35 74, 50 74 C 65 74, 70 78, 70 78 L 74 88 H 26 Z" fill="url(#metalGrad)"/>

  <!-- Ears / Side Bolts -->
  <rect x="23" y="44" width="6" height="12" rx="2" fill="#2D4A6B"/>
  <rect x="71" y="44" width="6" height="12" rx="2" fill="#2D4A6B"/>
  <circle cx="26" cy="50" r="1.5" fill="#00D4AA"/>
  <circle cx="74" cy="50" r="1.5" fill="#00D4AA"/>

  <!-- Main Head -->
  <rect x="28" y="30" width="44" height="38" rx="12" fill="url(#metalGrad)" stroke="#1A2640" stroke-width="2"/>
  
  <!-- Screen/Visor Face -->
  <rect x="33" y="35" width="34" height="24" rx="6" fill="#05080E" stroke="#1A2640" stroke-width="1"/>
  
  <!-- Glowing Digital Eyes/Expressions -->
  <!-- Cute digital blinking curves or dots -->
  <ellipse cx="43" cy="47" rx="3.5" ry="3.5" fill="url(#neonGlow)"/>
  <ellipse cx="57" cy="47" rx="3.5" ry="3.5" fill="url(#neonGlow)"/>
  <!-- Smile/Wiggle -->
  <path d="M 47 52 Q 50 54 53 52" fill="none" stroke="url(#neonGlow)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Antenna -->
  <rect x="48" y="18" width="4" height="12" fill="#2D4A6B"/>
  <circle cx="50" cy="16" r="4" fill="url(#neonGlow)" filter="drop-shadow(0px 0px 3px #00B4FF)"/>
</svg>
