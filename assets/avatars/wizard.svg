<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="wizBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21003D"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#wizBg)" stroke="#1A2640" stroke-width="2"/>

  <!-- Magic Sparkles/Brackets in air -->
  <text x="14" y="24" font-family="Courier, monospace" font-size="10" fill="#FFB800" opacity="0.6">{</text>
  <text x="80" y="24" font-family="Courier, monospace" font-size="10" fill="#FFB800" opacity="0.6">}</text>
  <path d="M 22 40 L 25 43 L 22 46 L 19 43 Z" fill="#00B4FF" opacity="0.5"/>
  <path d="M 78 45 L 81 48 L 78 51 L 75 48 Z" fill="#00D4AA" opacity="0.5"/>

  <!-- Wizard Beard (stylized vector) -->
  <path d="M 32 62 C 32 84, 50 88, 50 88 C 50 88, 68 84, 68 62 C 68 62, 50 72, 50 72 C 50 72, 32 62, 32 62 Z" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Face -->
  <circle cx="50" cy="52" r="14" fill="#FFCBB2"/>
  
  <!-- Wizard Nose and Glasses -->
  <path d="M 47 54 C 47 57, 53 57, 53 54" fill="none" stroke="#FFCBB2" stroke-width="2"/>
  <!-- Glasses -->
  <circle cx="43" cy="50" r="5" fill="none" stroke="#FFB800" stroke-width="1.5"/>
  <circle cx="57" cy="50" r="5" fill="none" stroke="#FFB800" stroke-width="1.5"/>
  <line x1="48" y1="50" x2="52" y2="50" stroke="#FFB800" stroke-width="1.5"/>

  <!-- Wizard Hat -->
  <!-- Brim -->
  <ellipse cx="50" cy="42" rx="26" ry="6" fill="url(#hatGrad)" stroke="#1A2640" stroke-width="1"/>
  <!-- Cone -->
  <path d="M 29 40 C 32 20, 42 8, 56 6 C 54 18, 62 30, 71 40 Z" fill="url(#hatGrad)"/>
  
  <!-- Yellow Moon / Star on Hat -->
  <path d="M 44 22 A 4 4 0 1 1 50 26 A 3.5 3.5 0 1 0 44 22 Z" fill="#FFB800"/>
  
  <!-- Magic Wand Tip Glow -->
  <circle cx="82" cy="74" r="3" fill="#FFB800" filter="drop-shadow(0px 0px 4px #FFB800)"/>
  <line x1="68" y1="84" x2="80" y2="76" stroke="#6B8CAE" stroke-width="3" stroke-linecap="round"/>
</svg>
