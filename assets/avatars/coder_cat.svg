<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="catBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#111B2D"/>
    </linearGradient>
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B5C"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#catBg)" stroke="#1A2640" stroke-width="2"/>

  <!-- Cat Ears -->
  <path d="M 28 42 L 20 22 L 36 30 Z" fill="#6B8CAE"/>
  <path d="M 28 42 L 23 25 L 33 31 Z" fill="#FFCBB2"/>
  
  <path d="M 72 42 L 80 22 L 64 30 Z" fill="#6B8CAE"/>
  <path d="M 72 42 L 77 25 L 67 31 Z" fill="#FFCBB2"/>

  <!-- Cat Head -->
  <ellipse cx="50" cy="50" rx="26" ry="20" fill="#6B8CAE"/>
  
  <!-- Cat Face Details -->
  <!-- Nose -->
  <polygon points="50,54 47,51 53,51" fill="#FFCBB2"/>
  <!-- Mouth -->
  <path d="M 46 58 Q 50 60 50 56 Q 50 60 54 58" fill="none" stroke="#2D4A6B" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="26" y1="52" x2="14" y2="50" stroke="#2D4A6B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="56" x2="12" y2="56" stroke="#2D4A6B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="74" y1="52" x2="86" y2="50" stroke="#2D4A6B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="74" y1="56" x2="88" y2="56" stroke="#2D4A6B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Programmer Geek Glasses -->
  <rect x="30" y="40" width="16" height="12" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="54" y="40" width="16" height="12" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="46" y1="46" x2="54" y2="46" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Glass reflection -->
  <line x1="33" y1="43" x2="39" y2="43" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
  <line x1="57" y1="43" x2="63" y2="43" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

  <!-- Cat Eyes (Visible behind glasses) -->
  <ellipse cx="38" cy="46" rx="2" ry="3" fill="#0D1520"/>
  <ellipse cx="62" cy="46" rx="2" ry="3" fill="#0D1520"/>
  <circle cx="39" cy="45" r="0.6" fill="#FFFFFF"/>
  <circle cx="63" cy="45" r="0.6" fill="#FFFFFF"/>

  <!-- Headphones -->
  <!-- Band -->
  <path d="M 27 38 A 25 25 0 0 1 73 38" fill="none" stroke="url(#headphoneGrad)" stroke-width="3"/>
  <!-- Ear pads -->
  <rect x="21" y="38" width="6" height="14" rx="3" fill="url(#headphoneGrad)"/>
  <rect x="73" y="38" width="6" height="14" rx="3" fill="url(#headphoneGrad)"/>
</svg>
